frr defaults traditional
hostname left
service integrated-vtysh-config
!
route-map PREFER-BOTTOM permit 10
 set local-preference 200
!
router bgp 65100
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.44.1.3 remote-as 65000
 neighbor 10.44.3.3 remote-as 65300
 address-family ipv4 unicast
  network 10.51.0.0/24
  neighbor 10.44.1.3 activate
  neighbor 10.44.3.3 activate
  neighbor 10.44.3.3 route-map PREFER-BOTTOM in
 exit-address-family
!